name: ci
on:
  pull_request:
  push:
    branches:
      - "**"
jobs:
  perl:
    name: "Perl ${{matrix.perl}} on ${{matrix.os}}"
    strategy:
      matrix:
        nodejs: ["18.x"]
        os: ["ubuntu-latest"]
        perl: ["5.32", "5.26", "5.16"]
    runs-on: "${{matrix.os}}"
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5  # v2
      - name: Use Node.js ${{matrix.node-version}}
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e  # v1
        with:
          node-version: "${{matrix.nodejs}}"
      - uses: shogo82148/actions-setup-perl@a198315ec4e9244f206879ea7b63078003aec8a6  # v1
        with:
          perl-version: "${{matrix.perl}}"
      - run: perl -V
      - name: Fix ExtUtils::MakeMaker for Perl 5.16
        run: cpanm -n App::cpanminus ExtUtils::MakeMaker
      - name: Install dependencies
        run: |
          cpanm -n Test::CPAN::Changes Test::Pod::Coverage Test::Pod Test::Spelling
          cpanm -n --installdeps .
      - name: Run tests
        run: prove -l t/*.t
        env:
          HARNESS_OPTIONS: j4
          TEST_CSS: 1
          TEST_JS: 1
          TEST_NPM: 1
          TEST_POD: 1
          TEST_ROLLUP: 1
          TEST_WEBPACK: 1
